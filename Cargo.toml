[workspace]
members = ["crates/*"]
resolver = "3"

[package]
name = "phoebe"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
description = "Experimental Phoebe language compiler"
license = "Apache-2.0"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
phoebe-capability = { path = "crates/capability" }
phoebe-core = { path = "crates/core" }
phoebe-frame = { path = "crates/frame" }
phoebe-native = { path = "crates/native" }
phoebe-project = { path = "crates/project" }
phoebe-runtime = { path = "crates/runtime" }
phoebe-syntax = { path = "crates/syntax" }
